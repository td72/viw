# Keeps the pinned action SHAs (release.yml) and the SwiftPM lock (Package.resolved) moving.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "⬆️"
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    groups:
      swift:
        patterns: ["*"]
    commit-message:
      prefix: "⬆️"
